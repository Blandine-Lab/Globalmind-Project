<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glowBlue" cx="15%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="95%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0B1220"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>

  <!-- LOGO -->
  <g transform="translate(64, 64)">
    <rect width="52" height="52" rx="14" fill="url(#brandGrad)"/>
    <g transform="translate(14, 15)" fill="#FFFFFF">
      <rect x="0" y="5" width="18" height="13" rx="3"/>
      <polygon points="18,9 24,6 24,18 18,15"/>
      <circle cx="9" cy="11.5" r="3" fill="#0B1220"/>
    </g>
    <text x="68" y="21" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="13" font-weight="700" fill="#94A3B8" letter-spacing="3">GLOBALMIND</text>
    <text x="68" y="44" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-size="20" font-weight="800" fill="#FFFFFF">SmartWatch™</text>
  </g>

  <!-- HEADLINE -->
  <text x="64" y="278" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="74" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Votre maison,</text>
  <text x="64" y="358" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="74" font-weight="800" fill="#FFFFFF" letter-spacing="-2">surveillée.</text>
  <text x="64" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="74" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">Vous, rassuré.</text>

  <!-- TRUST CHIPS -->
  <g transform="translate(64, 508)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect width="118" height="42" rx="21" fill="#0F172A" stroke="#1E293B"/>
    <circle cx="22" cy="21" r="5" fill="#10B981"/>
    <text x="36" y="27" font-size="14" font-weight="700" fill="#FFFFFF">LIVE · &lt;1s</text>

    <rect x="136" y="0" width="100" height="42" rx="21" fill="#0F172A" stroke="#1E293B"/>
    <text x="154" y="27" font-size="14" font-weight="700" fill="#FFFFFF">RGPD</text>

    <rect x="254" y="0" width="150" height="42" rx="21" fill="#0F172A" stroke="#1E293B"/>
    <text x="272" y="27" font-size="14" font-weight="700" fill="#FFFFFF">120+ foyers</text>
  </g>

  <!-- DASHBOARD MOCKUP -->
  <g transform="translate(672, 80)">
    <rect width="470" height="470" rx="26" fill="#111C2F" stroke="#1E293B"/>

    <!-- browser bar -->
    <circle cx="26" cy="24" r="5" fill="#EF4444"/>
    <circle cx="44" cy="24" r="5" fill="#F59E0B"/>
    <circle cx="62" cy="24" r="5" fill="#10B981"/>
    <rect x="94" y="14" width="290" height="20" rx="10" fill="#0B1220"/>
    <text x="104" y="28" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">app.globalmind-smartwatch.com</text>

    <rect x="0" y="46" width="470" height="1" fill="#1E293B"/>

    <!-- camera frame -->
    <g transform="translate(22, 66)">
      <rect width="426" height="240" rx="14" fill="#0B1220"/>

      <!-- scene -->
      <rect width="426" height="240" rx="14" fill="#0F172A"/>
      <ellipse cx="213" cy="140" rx="200" ry="100" fill="#1E293B" opacity="0.5"/>

      <!-- live badge -->
      <rect x="14" y="14" width="84" height="24" rx="6" fill="rgba(0,0,0,0.65)"/>
      <circle cx="26" cy="26" r="4" fill="#EF4444"/>
      <text x="36" y="31" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">LIVE</text>

      <!-- detection -->
      <rect x="150" y="72" width="104" height="140" rx="6" fill="none" stroke="#34D399" stroke-width="2"/>
      <rect x="150" y="52" width="76" height="18" rx="3" fill="#34D399"/>
      <text x="157" y="65" font-family="monospace" font-size="10" font-weight="700" fill="#0B1220">person 0.98</text>

      <!-- alert strip -->
      <rect x="14" y="204" width="398" height="24" rx="6" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.4)"/>
      <text x="26" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#FCD34D">● Mouvement · Entrée principale · il y a 2 min</text>
    </g>

    <!-- stats -->
    <g transform="translate(22, 326)" font-family="system-ui, sans-serif">
      <rect width="134" height="62" rx="10" fill="#0B1220" stroke="#1E293B"/>
      <text x="14" y="22" font-size="10" fill="#64748B" letter-spacing="1">CAMÉRAS</text>
      <text x="14" y="50" font-size="22" font-weight="800" fill="#FFFFFF">3</text>

      <rect x="146" y="0" width="134" height="62" rx="10" fill="#0B1220" stroke="#1E293B"/>
      <text x="160" y="22" font-size="10" fill="#64748B" letter-spacing="1">ALERTES</text>
      <text x="160" y="50" font-size="22" font-weight="800" fill="#FFFFFF">7</text>

      <rect x="292" y="0" width="134" height="62" rx="10" fill="#0B1220" stroke="#1E293B"/>
      <text x="306" y="22" font-size="10" fill="#64748B" letter-spacing="1">STOCKAGE</text>
      <text x="306" y="50" font-size="22" font-weight="800" fill="#FFFFFF">30j</text>
    </g>

    <!-- footer link -->
    <text x="22" y="436" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#60A5FA">globalmind-smartwatch.com</text>
  </g>
</svg>